<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taste &amp; Tales — KSA Growth &amp; Creative Tracker</title>
<style>
html,body{margin:0;background:#0F1115;min-height:100%;}

.tt-root{
  --bg:#0F1115; --bg2:#14171D; --gold:#D4AF37; --gold-soft:#C9A94E; --sand:#E7D9B8;
  --emerald:#10B981; --amber:#E0A43A; --rose:#E0736A; --slate:#7C8595;
  --text:#ECEEF2; --muted:#8A93A3; --hair:rgba(255,255,255,.07); --hair-gold:rgba(212,175,55,.22);
  position:relative; min-height:100%; background:var(--bg);
  color:var(--text); padding:22px 24px 108px; box-sizing:border-box;
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.5; overflow-x:hidden;
}
.tt-root *{box-sizing:border-box;}
.tt-serif{font-family:Georgia,Cambria,"Times New Roman",serif;}

.tt-glow{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(620px 320px at 88% -8%, rgba(212,175,55,.14), transparent 70%),
    radial-gradient(520px 360px at 0% 6%, rgba(16,185,129,.06), transparent 72%);
}

/* HEADER */
.tt-header{position:relative;display:flex;justify-content:space-between;align-items:center;
  gap:20px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--hair);}
.tt-brand{display:flex;align-items:center;gap:14px;}
.tt-mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--bg);
  background:linear-gradient(150deg,var(--gold),#B8912B);box-shadow:0 6px 20px rgba(212,175,55,.28);}
.tt-wordmark{font-family:Georgia,Cambria,serif;font-size:25px;letter-spacing:.3px;font-weight:600;line-height:1;}
.tt-amp{color:var(--gold);font-style:italic;}
.tt-sub{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:5px;letter-spacing:.2px;}
.tt-dot{width:3px;height:3px;border-radius:50%;background:var(--gold);}
.tt-head-right{display:flex;align-items:center;gap:18px;}
.tt-datebadge{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sand);
  border:1px solid var(--hair-gold);background:rgba(212,175,55,.06);padding:7px 12px;border-radius:999px;}
.tt-live{display:inline-flex;align-items:center;gap:5px;color:var(--emerald);font-weight:600;}
.tt-live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--emerald);
  box-shadow:0 0 0 0 rgba(16,185,129,.5);animation:ttpulse 2s infinite;}
@keyframes ttpulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

/* READINESS RING */
.tt-ring{position:relative;display:flex;align-items:center;gap:9px;}
.tt-ring svg{transform:rotate(0);}
.tt-ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:6;}
.tt-ring-fg{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;
  transition:stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1);}
.tt-ring-txt{position:absolute;left:0;width:66px;text-align:center;top:50%;transform:translateY(-50%);}
.tt-ring-num{font-family:Georgia,serif;font-size:17px;font-weight:600;color:var(--sand);}
.tt-ring-cap{font-size:10px;line-height:1.25;color:var(--muted);text-align:left;}

/* KPI STRIP */
.tt-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px;}
.tt-kpi{position:relative;padding:15px 15px 14px;border-radius:14px;border:1px solid var(--hair);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  backdrop-filter:blur(10px);overflow:hidden;}
.tt-kpi::after{content:"";position:absolute;top:0;left:0;width:100%;height:2px;
  background:linear-gradient(90deg,var(--gold),transparent);opacity:.5;}
.tt-kpi-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;margin-bottom:12px;}
.tt-kpi-val{font-family:Georgia,serif;font-size:27px;font-weight:600;letter-spacing:.5px;line-height:1;}
.tt-kpi-label{font-size:12px;color:var(--text);margin-top:8px;font-weight:500;}
.tt-kpi-sub{font-size:11px;color:var(--muted);margin-top:3px;}

/* TONES */
.tt-tone--gold{background:rgba(212,175,55,.14);color:var(--gold);}
.tt-tone--emerald{background:rgba(16,185,129,.14);color:var(--emerald);}
.tt-tone--amber{background:rgba(224,164,58,.15);color:var(--amber);}
.tt-tone--rose{background:rgba(224,115,106,.15);color:var(--rose);}
.tt-tone--slate{background:rgba(124,133,149,.16);color:var(--slate);}

/* TABS */
.tt-tabs{display:flex;gap:6px;margin:22px 0 20px;flex-wrap:wrap;
  border:1px solid var(--hair);padding:6px;border-radius:14px;
  background:rgba(255,255,255,.02);width:fit-content;max-width:100%;}
.tt-tab{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;
  border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px;
  font-family:inherit;cursor:pointer;transition:color .18s,background .18s;white-space:nowrap;}
.tt-tab:hover{color:var(--text);}
.tt-tab--on{color:var(--bg);background:linear-gradient(150deg,var(--gold),#C4992C);
  font-weight:600;box-shadow:0 4px 14px rgba(212,175,55,.25);}
.tt-tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* GRID + CARDS */
.tt-main{position:relative;}
.tt-grid{display:grid;gap:16px;}
.tt-grid--overview{grid-template-columns:2fr 1fr;}
.tt-grid--brand{grid-template-columns:1fr 1fr;}
.tt-grid--research,.tt-grid--video,.tt-grid--roadmap{grid-template-columns:1fr;}
.tt-span2{grid-column:span 2;}
.tt-span3{grid-column:1 / -1;}
.tt-grid--overview .tt-span2{grid-column:1 / 2;}
.tt-grid--overview .tt-span3{grid-column:1 / -1;}

.tt-card{border:1px solid var(--hair);border-radius:16px;padding:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.014));
  backdrop-filter:blur(12px);}

.tt-cardhead{display:flex;gap:11px;align-items:flex-start;margin-bottom:16px;}
.tt-cardhead-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:rgba(212,175,55,.12);color:var(--gold);}
.tt-cardhead-title{font-family:Georgia,serif;font-size:16px;font-weight:600;}
.tt-cardhead-note{font-size:12px;color:var(--muted);margin-top:2px;}

/* PILLS */
.tt-pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;letter-spacing:.4px;
  text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap;}
.tt-pill--emerald{background:rgba(16,185,129,.13);color:#3DDCA0;}
.tt-pill--amber{background:rgba(224,164,58,.14);color:#E8B85A;}
.tt-pill--rose{background:rgba(224,115,106,.14);color:#EC9089;}
.tt-pill--slate{background:rgba(124,133,149,.16);color:#A0A9B8;}
.tt-pill--gold{background:rgba(212,175,55,.14);color:var(--gold);}

/* BARS */
.tt-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:9px;}
.tt-bar-fill{display:block;height:100%;border-radius:99px;transition:width 1s cubic-bezier(.16,1,.3,1);}
.tt-bar-fill.tt-tone--emerald{background:var(--emerald);color:transparent;}
.tt-bar-fill.tt-tone--amber{background:var(--amber);}
.tt-bar-fill.tt-tone--slate{background:var(--slate);}
.tt-bar-fill.tt-tone--gold{background:linear-gradient(90deg,var(--gold),var(--sand));}

/* PHASES */
.tt-phases{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.tt-phase{position:relative;}
.tt-phase-top{display:flex;align-items:center;margin-bottom:11px;}
.tt-phase-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-family:Georgia,serif;font-weight:700;font-size:13px;flex:none;}
.tt-phase-line{flex:1;height:1px;background:var(--hair);margin-left:6px;}
.tt-phase-title{font-size:13px;font-weight:500;margin-bottom:7px;min-height:34px;}
.tt-phase-pct{font-size:11px;color:var(--muted);margin-top:6px;}

/* CHANNEL */
.tt-chan-list{display:flex;flex-direction:column;gap:13px;}
.tt-chan-row{display:flex;justify-content:space-between;align-items:baseline;}
.tt-chan-name{font-size:13px;font-weight:500;}
.tt-chan-pct{font-size:12px;color:var(--gold);font-family:Georgia,serif;}
.tt-chan-note{font-size:11px;color:var(--muted);margin-top:5px;}

/* FEED */
.tt-feed{display:flex;flex-direction:column;}
.tt-feed-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--hair);}
.tt-feed-row:last-child{border-bottom:none;}
.tt-feed-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.05);color:var(--sand);}
.tt-feed-text{flex:1;font-size:13px;color:#D5D9E0;}
.tt-feed-time{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}

/* BRAND HUB */
.tt-hub{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tt-hub-card{border:1px solid var(--hair);border-radius:12px;padding:14px;background:rgba(255,255,255,.02);}
.tt-hub-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:11px;
  background:rgba(212,175,55,.1);color:var(--gold);}
.tt-hub-title{font-size:13.5px;font-weight:600;margin-bottom:5px;}
.tt-hub-note{font-size:11.5px;color:var(--muted);margin-bottom:11px;line-height:1.45;min-height:48px;}

/* ASSETS */
.tt-assets{display:flex;flex-direction:column;gap:9px;}
.tt-asset{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;
  border:1px solid var(--hair);background:rgba(255,255,255,.02);}
.tt-asset-main{flex:1;display:flex;flex-direction:column;}
.tt-asset-name{font-size:13px;font-weight:500;}
.tt-asset-meta{font-size:11px;color:var(--muted);}

/* SWATCHES */
.tt-swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
.tt-swatch{display:flex;flex-direction:column;gap:2px;padding:0;border:1px solid var(--hair);
  border-radius:12px;overflow:hidden;background:rgba(255,255,255,.02);cursor:pointer;text-align:left;
  font-family:inherit;color:var(--text);transition:border-color .18s,transform .18s;}
.tt-swatch:hover{border-color:var(--hair-gold);transform:translateY(-2px);}
.tt-swatch:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.tt-swatch-chip{position:relative;height:52px;display:grid;place-items:center;}
.tt-swatch-copied{background:rgba(0,0,0,.35);color:#fff;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;backdrop-filter:blur(2px);}
.tt-swatch-name{font-size:12px;font-weight:600;padding:8px 10px 0;}
.tt-swatch-hex{font-size:11px;color:var(--gold);padding:0 10px;font-variant-numeric:tabular-nums;}
.tt-swatch-role{font-size:10.5px;color:var(--muted);padding:0 10px 9px;}

/* TYPE */
.tt-type{display:flex;flex-direction:column;gap:14px;}
.tt-type-row{display:flex;align-items:center;gap:14px;}
.tt-type-spec-serif{font-family:Georgia,serif;font-size:34px;font-weight:600;color:var(--sand);width:52px;text-align:center;flex:none;}
.tt-type-spec-sans{font-size:32px;font-weight:700;width:52px;text-align:center;flex:none;color:var(--text);}
.tt-type-name{font-size:13px;font-weight:600;}
.tt-type-desc{font-size:11.5px;color:var(--muted);line-height:1.45;}
.tt-type-grid{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:4px;}
.tt-type-grid>span{height:26px;background:rgba(212,175,55,.09);border-radius:4px;}
.tt-type-gridcap{grid-column:1 / -1;font-size:10.5px;color:var(--muted);margin-top:4px;}

/* INSIGHTS */
.tt-insights{display:flex;flex-direction:column;gap:11px;}
.tt-insight{border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.02);
  transition:border-color .2s;}
.tt-insight--on{border-color:var(--hair-gold);}
.tt-insight-head{display:flex;align-items:center;gap:11px;width:100%;padding:13px 15px;background:transparent;
  border:none;color:var(--text);cursor:pointer;font-family:inherit;text-align:left;}
.tt-insight-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:rgba(212,175,55,.1);color:var(--gold);}
.tt-insight-title{font-size:14px;font-weight:600;flex:1;}
.tt-insight-tag{font-size:11px;color:var(--muted);border:1px solid var(--hair);padding:3px 8px;border-radius:99px;}
.tt-chev{color:var(--muted);transition:transform .25s;}
.tt-chev--on{transform:rotate(180deg);color:var(--gold);}
.tt-insight-body{padding:0 15px 16px 56px;animation:ttfade .28s ease;}
@keyframes ttfade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.tt-quote{position:relative;padding:12px 14px;border-left:2px solid var(--gold);
  background:rgba(212,175,55,.05);border-radius:0 10px 10px 0;margin-bottom:13px;}
.tt-quote-mark{color:var(--gold);opacity:.5;margin-bottom:4px;}
.tt-quote-ar{display:block;font-size:16px;color:var(--sand);line-height:1.8;}
.tt-quote-en{display:block;font-size:12px;color:var(--muted);font-style:italic;margin-top:4px;}
.tt-insight-points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.tt-insight-points li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#D5D9E0;}
.tt-insight-points svg{color:var(--emerald);margin-top:3px;flex:none;}
.tt-insight-flags{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px;}
.tt-flag{font-size:12px;color:#D5D9E0;padding:11px 13px;border-radius:10px;line-height:1.5;}
.tt-flag span{display:block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px;}
.tt-flag--pain{background:rgba(224,115,106,.08);border:1px solid rgba(224,115,106,.2);}
.tt-flag--pain span{color:var(--rose);}
.tt-flag--opp{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.2);}
.tt-flag--opp span{color:var(--emerald);}

/* FILTER BAR */
.tt-filterbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;
  padding:12px 14px;border:1px solid var(--hair);border-radius:13px;background:rgba(255,255,255,.02);}
.tt-filter-label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);}
.tt-filter-chips{display:flex;gap:7px;flex-wrap:wrap;}
.tt-chip{padding:6px 13px;border-radius:99px;border:1px solid var(--hair);background:transparent;
  color:var(--muted);font-size:12px;font-family:inherit;cursor:pointer;transition:all .16s;}
.tt-chip:hover{color:var(--text);border-color:var(--hair-gold);}
.tt-chip--on{background:rgba(212,175,55,.14);color:var(--gold);border-color:var(--hair-gold);font-weight:600;}
.tt-filter-count{margin-left:auto;font-size:12px;color:var(--muted);}

/* CREATIVES */
.tt-creatives{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.tt-creative{border:1px solid var(--hair);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.02);
  transition:border-color .18s,transform .18s;}
.tt-creative:hover{border-color:var(--hair-gold);transform:translateY(-2px);}
.tt-creative-thumb{position:relative;height:104px;display:grid;place-items:center;color:rgba(231,217,184,.5);
  background:linear-gradient(135deg,rgba(212,175,55,.1),rgba(16,185,129,.05),rgba(255,255,255,.02));}
.tt-creative-format{position:absolute;bottom:9px;left:10px;font-size:10.5px;color:var(--sand);
  background:rgba(0,0,0,.35);padding:3px 8px;border-radius:6px;backdrop-filter:blur(3px);}
.tt-creative-body{padding:13px 14px 12px;}
.tt-creative-title{font-size:14px;font-weight:600;margin-bottom:9px;}
.tt-creative-hook{margin-bottom:12px;}
.tt-hook-ar{display:block;font-size:14px;color:var(--sand);line-height:1.7;}
.tt-hook-en{display:block;font-size:12px;color:var(--muted);font-style:italic;margin-top:3px;}
.tt-creative-foot{display:flex;align-items:center;justify-content:space-between;}

.tt-icon-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--hair);background:transparent;
  color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:all .16s;flex:none;}
.tt-icon-btn:hover{color:var(--gold);border-color:var(--hair-gold);}

/* VIDEO */
.tt-videos{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.tt-video{display:flex;gap:13px;border:1px solid var(--hair);border-radius:14px;padding:13px;background:rgba(255,255,255,.02);}
.tt-video-thumb{position:relative;width:96px;height:110px;flex:none;border-radius:11px;display:grid;place-items:center;
  color:rgba(231,217,184,.55);background:linear-gradient(150deg,rgba(212,175,55,.12),rgba(0,0,0,.25));}
.tt-video-dur{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--sand);
  background:rgba(0,0,0,.4);padding:2px 7px;border-radius:5px;font-variant-numeric:tabular-nums;}
.tt-video-body{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}
.tt-video-title{font-size:14px;font-weight:600;}
.tt-video-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);}
.tt-video-meta span{display:inline-flex;align-items:center;gap:5px;}
.tt-video-track{display:flex;flex-direction:column;gap:6px;margin-top:2px;}
.tt-track{display:flex;align-items:center;gap:8px;font-size:11px;}
.tt-track-k{color:var(--muted);width:32px;}
.tt-fb-toggle{margin-top:4px;align-self:flex-start;display:inline-flex;align-items:center;gap:7px;
  padding:7px 13px;border-radius:9px;border:1px solid var(--hair);background:transparent;color:var(--muted);
  font-size:12px;font-family:inherit;cursor:pointer;transition:all .16s;}
.tt-fb-toggle:hover{color:var(--text);border-color:var(--hair-gold);}
.tt-fb-toggle--on{background:rgba(16,185,129,.12);color:#3DDCA0;border-color:rgba(16,185,129,.3);}

/* GANTT */
.tt-gantt{display:flex;flex-direction:column;gap:8px;overflow-x:auto;}
.tt-gantt-head,.tt-gantt-row{display:grid;grid-template-columns:190px repeat(8,1fr);align-items:center;gap:0;min-width:640px;}
.tt-gantt-week{font-size:11px;color:var(--muted);text-align:center;padding-bottom:6px;
  border-bottom:1px solid var(--hair);}
.tt-gantt-corner{border-bottom:1px solid var(--hair);}
.tt-gantt-task{font-size:12.5px;color:#D5D9E0;padding-right:14px;}
.tt-gantt-track{grid-column:2 / -1;display:grid;grid-template-columns:repeat(8,1fr);
  background:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),var(--hair) calc(12.5% - 1px),var(--hair) 12.5%);
  border-radius:6px;padding:5px 0;}
.tt-gantt-bar{height:16px;border-radius:6px;opacity:.92;}
.tt-legend{display:flex;gap:20px;margin-top:16px;font-size:11.5px;color:var(--muted);}
.tt-legend span{display:inline-flex;align-items:center;gap:7px;}
.tt-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}

/* ACTION BAR */
.tt-actionbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:space-between;
  width:min(940px,calc(100% - 36px));padding:13px 16px 13px 22px;border-radius:16px;
  border:1px solid var(--hair-gold);background:rgba(20,23,29,.82);backdrop-filter:blur(16px);
  box-shadow:0 14px 44px rgba(0,0,0,.5);}
.tt-actionbar-info{font-size:13px;color:var(--muted);}
.tt-bar-strong{color:var(--sand);font-weight:600;}
.tt-bar-msg{display:inline-flex;align-items:center;gap:8px;color:#3DDCA0;font-weight:500;}
.tt-actionbar-btns{display:flex;gap:10px;flex-wrap:wrap;}
.tt-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;
  font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .16s;}
.tt-btn--ghost{background:transparent;border-color:var(--hair);color:var(--text);}
.tt-btn--ghost:hover{border-color:var(--hair-gold);color:var(--sand);}
.tt-btn--gold{background:linear-gradient(150deg,var(--gold),#C4992C);color:var(--bg);
  box-shadow:0 6px 18px rgba(212,175,55,.3);}

  return '<header class="tt-header">' +
    '<div class="tt-brand"><div class="tt-mark">' + ic('Utensils', 20, 1.6) + '</div>' +
      '<div><div class="tt-wordmark">Taste <span class="tt-amp">&amp;</span> Tales</div>' +
      '<div class="tt-sub">KSA Growth &amp; Creative Tracker <span class="tt-dot"></span>Q3 / Q4</div></div></div>' +
    '<div class="tt-head-right">' +
      '<div class="tt-datebadge">' + ic('Calendar', 13, 1.8) + ' ' + today + ' <span class="tt-live">Live</span></div>' +
      ring(82) + '</div></header>';
}

function kpis() {
  var h = KPIS.map(function (k) {
    return '<div class="tt-kpi"><div class="tt-kpi-icon tt-tone--' + k.tone + '">' + ic(k.icon, 17, 1.7) + '</div>' +
      '<div class="tt-kpi-val">' + k.value + '</div>' +
      '<div class="tt-kpi-label">' + k.label + '</div>' +
      '<div class="tt-kpi-sub">' + k.sub + '</div></div>';
  }).join('');
  return '<section class="tt-kpis">' + h + '</section>';
}

function tabs() {
  var h = TABS.map(function (t) {
    var on = state.tab === t.id;
    return '<button role="tab" aria-selected="' + on + '" data-tab="' + t.id + '" class="tt-tab' + (on ? ' tt-tab--on' : '') + '">' +
      ic(t.icon, 15, 1.8) + ' ' + t.label + '</button>';
  }).join('');
  return '<nav class="tt-tabs" role="tablist">' + h + '</nav>';
}

function cardHead(icon, title, note) {
  return '<div class="tt-cardhead"><span class="tt-cardhead-icon">' + ic(icon, 16, 1.7) + '</span>' +
    '<div><div class="tt-cardhead-title">' + title + '</div>' +
    (note ? '<div class="tt-cardhead-note">' + note + '</div>' : '') + '</div></div>';
}

/* ---------- panels ---------- */
function overview() {
  var phases = PHASES.map(function (p, i) {
    var tone = statusTone(p.status);
    return '<div class="tt-phase"><div class="tt-phase-top">' +
      '<span class="tt-phase-dot tt-tone--' + tone + '">' + p.n + '</span>' +
      (i < PHASES.length - 1 ? '<span class="tt-phase-line"></span>' : '') + '</div>' +
      '<div class="tt-phase-title">' + p.title + '</div>' + pill(p.status, tone) +
      '<div class="tt-bar"><span style="width:' + p.pct + '%" class="tt-bar-fill tt-tone--' + tone + '"></span></div>' +
      '<div class="tt-phase-pct">' + p.pct + '%</div></div>';
  }).join('');

  var chans = CHANNELS.map(function (ch) {
    return '<div class="tt-chan"><div class="tt-chan-row"><span class="tt-chan-name">' + ch.name + '</span>' +
      '<span class="tt-chan-pct">' + ch.ready + '%</span></div>' +
      '<div class="tt-bar"><span style="width:' + ch.ready + '%" class="tt-bar-fill tt-tone--gold"></span></div>' +
      '<div class="tt-chan-note">' + ch.note + '</div></div>';
  }).join('');

  var feed = ACTIVITY.map(function (a) {
    return '<div class="tt-feed-row"><span class="tt-feed-icon">' + ic(a.icon, 14, 1.8) + '</span>' +
      '<span class="tt-feed-text">' + a.text + '</span><span class="tt-feed-time">' + a.t + '</span></div>';
  }).join('');

  return '<div class="tt-grid tt-grid--overview">' +
    '<section class="tt-card tt-span2">' + cardHead('Target', 'Strategic progress roadmap', 'Four phases from foundation to media-buy launch') +
      '<div class="tt-phases">' + phases + '</div></section>' +
    '<section class="tt-card">' + cardHead('Radio', 'Channel readiness', 'Setup status across prepared channels') +
      '<div class="tt-chan-list">' + chans + '</div></section>' +
    '<section class="tt-card tt-span3">' + cardHead('Clock', 'Recent activity', 'Live log of asset, research and revision updates') +
      '<div class="tt-feed">' + feed + '</div></section></div>';
}

function brand() {
  var hub = BRAND_HUB.map(function (b) {
    return '<div class="tt-hub-card"><div class="tt-hub-icon">' + ic(b.icon, 18, 1.6) + '</div>' +
      '<div class="tt-hub-title">' + b.title + '</div><div class="tt-hub-note">' + b.note + '</div>' +
      pill(b.status, 'emerald') + '</div>';
  }).join('');

  var assets = ASSETS.map(function (a) {
    return '<div class="tt-asset"><div class="tt-asset-main"><span class="tt-asset-name">' + a.name + '</span>' +
      '<span class="tt-asset-meta">' + a.meta + '</span></div>' + pill(a.status, statusTone(a.status)) +
      '<button class="tt-icon-btn" title="Preview / download">' + ic('Download', 14, 1.8) + '</button></div>';
  }).join('');

  var swatches = PALETTE.map(function (p) {
    var on = state.copied === p.hex;
    return '<button class="tt-swatch" data-hex="' + p.hex + '">' +
      '<span class="tt-swatch-chip" style="background:' + p.hex + '">' +
      (on ? '<span class="tt-swatch-copied">' + ic('Check', 14, 2.2) + '</span>' : '') + '</span>' +
      '<span class="tt-swatch-name">' + p.name + '</span>' +
      '<span class="tt-swatch-hex">' + (on ? 'Copied' : p.hex) + '</span>' +
      '<span class="tt-swatch-role">' + p.role + '</span></button>';
  }).join('');

  var type = '<div class="tt-type">' +
    '<div class="tt-type-row"><div class="tt-type-spec-serif">Aa</div><div>' +
      '<div class="tt-type-name">Display \u2014 modern serif</div>' +
      '<div class="tt-type-desc">High-contrast serif for headlines, paired with Arabic calligraphic display.</div></div></div>' +
    '<div class="tt-type-row"><div class="tt-type-spec-sans">Aa</div><div>' +
      '<div class="tt-type-name">Body \u2014 humanist sans</div>' +
      '<div class="tt-type-desc">Latin sans + IBM Plex Arabic for menus, captions and UI copy.</div></div></div>' +
    '<div class="tt-type-grid"><span></span><span></span><span></span><span></span><span></span><span></span>' +
      '<div class="tt-type-gridcap">12-column Swiss grid \u00b7 8px baseline</div></div></div>';

  return '<div class="tt-grid tt-grid--brand">' +
    '<section class="tt-card tt-span2">' + cardHead('Sparkles', 'Brand book hub', 'Completed identity system \u2014 all modules final') +
      '<div class="tt-hub">' + hub + '</div></section>' +
    '<section class="tt-card">' + cardHead('FileText', 'Asset library', 'Download & approval status') +
      '<div class="tt-assets">' + assets + '</div></section>' +
    '<section class="tt-card tt-span2">' + cardHead('Palette', 'Color palette system', 'Click any swatch to copy its HEX') +
      '<div class="tt-swatches">' + swatches + '</div></section>' +
    '<section class="tt-card">' + cardHead('Type', 'Typography & grid', 'Headline, body and layout rules') + type + '</section></div>';
}

function research() {
  var items = INSIGHTS.map(function (it) {
    var on = state.openInsight === it.id;
    var body = '';
    if (on) {
      var quote = it.quote ? '<div class="tt-quote">' + ic('Quote', 15, 1.6) +
        '<span class="tt-quote-ar" dir="rtl">' + it.quote + '</span>' +
        '<span class="tt-quote-en">' + it.quoteEn + '</span></div>' : '';
      var points = '<ul class="tt-insight-points">' + it.points.map(function (p) {
        return '<li>' + ic('Check', 13, 2) + ' ' + p + '</li>';
      }).join('') + '</ul>';
      var flags = '<div class="tt-insight-flags">' +
        '<div class="tt-flag tt-flag--pain"><span>Pain point</span>' + it.pain + '</div>' +
        '<div class="tt-flag tt-flag--opp"><span>Opportunity</span>' + it.opp + '</div></div>';
      body = '<div class="tt-insight-body">' + quote + points + flags + '</div>';
    }
    return '<div class="tt-insight' + (on ? ' tt-insight--on' : '') + '">' +
      '<button class="tt-insight-head" data-insight="' + it.id + '">' +
        '<span class="tt-insight-icon">' + ic(it.icon, 16, 1.7) + '</span>' +
        '<span class="tt-insight-title">' + it.title + '</span>' +
        '<span class="tt-insight-tag">' + it.tag + '</span>' +
        '<span class="tt-chev' + (on ? ' tt-chev--on' : '') + '">' + ic('ChevronDown', 16, 1.8) + '</span>' +
      '</button>' + body + '</div>';
  }).join('');
  return '<div class="tt-grid tt-grid--research"><section class="tt-card tt-span3">' +
    cardHead('MapPin', 'Local Saudi research & ground intelligence', '450+ field touchpoints across Riyadh & Jeddah \u2014 tap a stream to expand') +
    '<div class="tt-insights">' + items + '</div></section></div>';
}

function creative() {
  var list = CREATIVES.filter(function (c) {
    if (state.filter === 'All') return true;
    if (state.filter === 'Pending review') return c.status === 'Under review';
    return c.status === state.filter;
  });
  var chips = FILTERS.map(function (f) {
    return '<button class="tt-chip' + (state.filter === f ? ' tt-chip--on' : '') + '" data-filter="' + f + '">' + f + '</button>';
  }).join('');
  var cards = list.map(function (c) {
    return '<div class="tt-creative"><div class="tt-creative-thumb">' + ic('Camera', 22, 1.3) +
      '<span class="tt-creative-format">' + c.format + '</span></div>' +
      '<div class="tt-creative-body"><div class="tt-creative-title">' + c.title + '</div>' +
      '<div class="tt-creative-hook"><span class="tt-hook-ar" dir="rtl">' + c.ar + '</span>' +
      '<span class="tt-hook-en">' + c.en + '</span></div>' +
      '<div class="tt-creative-foot">' + pill(c.status, statusTone(c.status)) +
      '<button class="tt-icon-btn" title="Preview">' + ic('Eye', 13, 1.8) + '</button></div></div></div>';
  }).join('');
  return '<div><div class="tt-filterbar">' +
    '<div class="tt-filter-label">' + ic('Filter', 14, 1.8) + ' Filter creatives</div>' +
    '<div class="tt-filter-chips">' + chips + '</div>' +
    '<div class="tt-filter-count">' + list.length + ' shown</div></div>' +
    '<div class="tt-creatives">' + cards + '</div></div>';
}

function video() {
  var cards = VIDEOS.map(function (v, i) {
    var fb = state.feedback[i];
    return '<div class="tt-video"><div class="tt-video-thumb">' + ic('PlayCircle', 26, 1.3) +
      '<span class="tt-video-dur">' + v.dur + '</span></div>' +
      '<div class="tt-video-body"><div class="tt-video-title">' + v.title + '</div>' +
      '<div class="tt-video-meta"><span>' + ic('Smartphone', 12, 1.8) + ' ' + v.platform + '</span>' +
      '<span>' + ic('Radio', 12, 1.8) + ' ' + v.audio + '</span></div>' +
      '<div class="tt-video-track">' +
      '<span class="tt-track"><span class="tt-track-k">Raw</span> ' + pill(v.raw, statusTone(v.raw)) + '</span>' +
      '<span class="tt-track"><span class="tt-track-k">Post</span> ' + pill(v.post, VSTATE[v.state]) + '</span></div>' +
      '<button class="tt-fb-toggle' + (fb ? ' tt-fb-toggle--on' : '') + '" data-vid="' + i + '">' +
      ic('ThumbsUp', 13, 1.9) + ' ' + (fb ? 'Feedback submitted' : 'Submit feedback') + '</button></div></div>';
  }).join('');
  return '<div class="tt-grid tt-grid--video"><section class="tt-card tt-span3">' +
    cardHead('Video', 'Reels & video production pipeline', '12 raw reels shot \u00b7 6 drafts in client review') +
    '<div class="tt-videos">' + cards + '</div></section></div>';
}

function roadmap() {
  var weeks = ''; for (var w = 1; w <= 8; w++) weeks += '<span class="tt-gantt-week">W' + w + '</span>';
  var rows = GANTT.map(function (g) {
    return '<div class="tt-gantt-row"><span class="tt-gantt-task">' + g.task + '</span>' +
      '<div class="tt-gantt-track"><span class="tt-gantt-bar tt-tone--' + g.tone +
      '" style="grid-column:' + g.start + ' / span ' + g.span + '"></span></div></div>';
  }).join('');
  var legend = '<div class="tt-legend">' +
    '<span><i class="tt-tone--emerald"></i> Done</span>' +
    '<span><i class="tt-tone--amber"></i> Active / review</span>' +
    '<span><i class="tt-tone--slate"></i> Queued</span></div>';
  return '<div class="tt-grid tt-grid--roadmap"><section class="tt-card tt-span3">' +
    cardHead('Calendar', 'Multi-channel rollout', '8-week launch schedule \u2014 Q3 into Q4') +
    '<div class="tt-gantt"><div class="tt-gantt-head"><span class="tt-gantt-corner"></span>' + weeks + '</div>' +
    rows + '</div>' + legend + '</section></div>';
}

function panel() {
  switch (state.tab) {
    case 'brand': return brand();
    case 'research': return research();
    case 'creative': return creative();
    case 'video': return video();
    case 'roadmap': return roadmap();
    default: return overview();
  }
}

function actionbar() {
  var info = state.barMsg
    ? '<span class="tt-bar-msg">' + ic('Check', 15, 2) + ' ' + state.barMsg + '</span>'
    : '<span class="tt-bar-strong">18 creatives</span> awaiting your decision this batch.';
  return '<div class="tt-actionbar"><div class="tt-actionbar-info">' + info + '</div>' +
    '<div class="tt-actionbar-btns">' +
    '<button class="tt-btn tt-btn--ghost" data-bar="Meeting request sent to the account team.">' +
      ic('Send', 14, 1.9) + ' Request feedback meeting</button>' +
    '<button class="tt-btn tt-btn--gold" data-bar="Batch of 18 approved \u2014 client notified.">' +
      ic('ThumbsUp', 14, 1.9) + ' Approve current batch (18)</button></div></div>';
}

function render() {
  document.getElementById('root').innerHTML =
    '<div class="tt-glow" aria-hidden="true"></div>' +
    header() + kpis() + tabs() +
    '<main class="tt-main">' + panel() + '</main>' +
    actionbar();
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-tab],[data-insight],[data-filter],[data-hex],[data-vid],[data-bar]');
  if (!el) return;
  if (el.hasAttribute('data-tab')) { state.tab = el.getAttribute('data-tab'); render(); }
  else if (el.hasAttribute('data-insight')) {
    var id = el.getAttribute('data-insight');
    state.openInsight = state.openInsight === id ? null : id; render();
  } else if (el.hasAttribute('data-filter')) { state.filter = el.getAttribute('data-filter'); render(); }
  else if (el.hasAttribute('data-hex')) {
    var hex = el.getAttribute('data-hex');
    if (navigator.clipboard) navigator.clipboard.writeText(hex).catch(function () {});
    state.copied = hex; render();
    setTimeout(function () { if (state.copied === hex) { state.copied = null; render(); } }, 1400);
  } else if (el.hasAttribute('data-vid')) {
    var i = el.getAttribute('data-vid'); state.feedback[i] = !state.feedback[i]; render();
  } else if (el.hasAttribute('data-bar')) {
    state.barMsg = el.getAttribute('data-bar'); render();
    setTimeout(function () { state.barMsg = null; render(); }, 2600);
  }
});

render();

</script>
</body>
</html>
